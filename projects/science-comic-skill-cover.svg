    <path d="M 72 300 L 118 300" stroke="#64ffda" stroke-width="3" opacity="0.7"/>
    <circle cx="88" cy="312" r="4" fill="#64ffda" opacity="0.8"/>
    <circle cx="102" cy="316" r="3" fill="#64ffda" opacity="0.6"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a192f"/>
      <stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <pattern id="dotsm" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e3a5f"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bgm)"/>
  <rect width="1200" height="675" fill="url(#dotsm)"/>

  <!-- stacked frames: one beat at a time -->
  <g transform="translate(700,150)">
    <rect x="46" y="40" width="400" height="262" rx="10" fill="none" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="23" y="20" width="400" height="262" rx="10" fill="none" stroke="#64ffda" stroke-width="3" opacity="0.35"/>
    <rect x="0" y="0" width="400" height="262" rx="10" fill="#0e2036" stroke="#64ffda" stroke-width="3"/>
    <!-- two bars, the same pair the blood-sugar episode draws -->
    <rect x="40" y="84" width="190" height="12" rx="6" fill="#64ffda" opacity="0.6"/>
    <circle cx="230" cy="90" r="7" fill="#64ffda"/>
    <rect x="40" y="126" width="250" height="12" rx="6" fill="#64ffda" opacity="0.28"/>
    <!-- average marker -->
    <line x1="272" y1="64" x2="272" y2="152" stroke="#e6f1ff" stroke-width="2" stroke-dasharray="7 7" opacity="0.55"/>
    <line x1="40" y1="164" x2="360" y2="164" stroke="#1e3a5f" stroke-width="2"/>
    <!-- beat ticks -->
    <rect x="40" y="204" width="58" height="8" rx="4" fill="#64ffda" opacity="0.22"/>
    <rect x="110" y="204" width="58" height="8" rx="4" fill="#64ffda" opacity="0.22"/>
    <rect x="180" y="204" width="58" height="8" rx="4" fill="#64ffda" opacity="0.22"/>
    <rect x="250" y="204" width="58" height="8" rx="4" fill="#64ffda" opacity="0.22"/>
    <!-- play -->
    <path d="M 334 194 L 360 208 L 334 222 Z" fill="#64ffda"/>
  </g>

  <!-- title -->
  <text x="80" y="292" font-family="Inter, Arial, sans-serif" font-size="84" font-weight="800" fill="#e6f1ff">医学科普漫画</text>
  <text x="84" y="354" font-family="Inter, Arial, sans-serif" font-size="34" fill="#8892b0">One idea per episode</text>
  <rect x="84" y="392" width="120" height="6" fill="#64ffda"/>
  <text x="84" y="452" font-family="Inter, Arial, sans-serif" font-size="26" fill="#64ffda">Agent Skill · Remotion · Auto QA</text>
  <text x="84" y="492" font-family="Inter, Arial, sans-serif" font-size="24" fill="#5d7391">3:4 vertical · ~100 s · every frame drawn in code</text>
</svg>
